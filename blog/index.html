var jp=localStorage.getItem('sw_jp')==='1';var post;function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function inline(v){return esc(v).replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+"([^"]*)")?\)/g,'<img alt="$1" src="$2" title="$3">').replace(/\[([^\]]+)\]\(([^\s)]+)\)/g,'<a href="$2">$1</a>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>')}function markdown(source,base){var lines=source.replace(/\r/g,'').split('\n'),out='',i=0;while(i<lines.length){var line=lines[i];if(/^```/.test(line)){var lang=line.slice(3).trim(),code=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){code.push(lines[i]);i++}out+='<pre><code class="language-'+esc(lang)+'">'+esc(code.join('\n'))+'</code></pre>';i++;continue}if(!line.trim()){i++;continue}var h=line.match(/^(#{1,3})\s+(.+)$/);if(h){out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';i++;continue}if(/^---+$/.test(line.trim())){out+='<hr>';i++;continue}if(/^>\s?/.test(line)){var quote=[];while(i<lines.length&&/^>\s?/.test(lines[i])){quote.push(lines[i].replace(/^>\s?/,''));i++}out+='<blockquote>'+inline(quote.join(' '))+'</blockquote>';continue}if(/^[-*+]\s+/.test(line)||/^\d+\.\s+/.test(line)){var ordered=/^\d+\.\s+/.test(line),items=[];while(i<lines.length&&(ordered?/^\d+\.\s+/:/^[-*+]\s+/).test(lines[i])){items.push(lines[i].replace(ordered?/^\d+\.\s+/:/^[-*+]\s+/,''));i++}out+='<'+(ordered?'ol':'ul')+'>'+items.map(function(item){return '<li>'+inline(item)+'</li>'}).join('')+'</'+(ordered?'ol':'ul')+'>';continue}var para=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3})\s|^```|^>\s?|^[-*+]\s+|^\d+\.\s+|^---+$/.test(lines[i])){para.push(lines[i]);i++}out+='<p>'+inline(para.join('\n').replace(/\n/g,'<br>'))+'</p>'}var temp=document.createElement('div');temp.innerHTML=out;temp.querySelectorAll('img').forEach(function(img){img.src=new URL(img.getAttribute('src'),base).href});return temp.innerHTML}
function dateText(v){return new Date(v+'T00:00:00').toLocaleDateString(jp?'ja-JP':'en-GB',{year:'numeric',month:'short',day:'numeric'})}function typeText(v){return {Review:jp?'レビュー':'Review','Grab Bag':jp?'雑談':'Grab Bag',Update:jp?'新着':'Update'}[v]||v}function langPath(){var available=post.main_lang||[];if(jp&&post.content_jp&&available.indexOf('jp')>=0)return post.content_jp;return post.content_en||post.content_jp}function contentPath(){return 'posts/'+encodeURIComponent(post.unique_id)+'/'+langPath()}function render(){var title=jp?(post.title_jp||post.title_en):post.title_en||post.title_jp;document.title=title+' — shinobu_works';document.getElementById('post-id').textContent=post.unique_id;document.getElementById('post-title').textContent=title;document.getElementById('post-date').textContent=dateText(post.date);document.getElementById('post-type').textContent=typeText(post.post_type);document.getElementById('post-meta').innerHTML=(post.main_lang||[]).map(function(v){return '<span>'+esc(v)+'</span>'}).join('');document.getElementById('nav-home').textContent=jp?'ホーム':'home';document.getElementById('nav-works').textContent=jp?'制作実績':'works';document.getElementById('nav-blog').textContent=jp?'ブログ':'updates';document.getElementById('nav-art').textContent=jp?'イラスト':'art';document.getElementById('nav-about').textContent=jp?'自己紹介':'about';document.getElementById('nav-contact').textContent=jp?'お問い合わせ':'contact';document.getElementById('lang-btn').textContent=jp?'English':'日本語';document.documentElement.lang=jp?'ja':'en';if(post.__markdown)document.getElementById('post-content').innerHTML=markdown(post.__markdown,new URL(contentPath(),location.href));document.getElementById('post-status').style.display='none'}window.toggleDark=function(){document.body.classList.toggle('dark');localStorage.setItem('sw_dark',document.body.classList.contains('dark')?'1':'0')};window.toggleLang=function(){jp=!jp;localStorage.setItem('sw_jp',jp?'1':'0');if(post)loadMarkdown()};window.toggleNavDropdown=function(){document.getElementById('nav-btn-wrap').classList.toggle('open')};document.addEventListener('click',function(e){if(!e.target.closest('#nav-btn-wrap'))document.getElementById('nav-btn-wrap').classList.remove('open')});function loadMarkdown(){var path=contentPath();fetch(path).then(function(r){if(!r.ok)throw Error('markdown unavailable');return r.text()}).then(function(text){post.__markdown=text;render()}).catch(function(){document.getElementById('post-status').className='status error';document.getElementById('post-status').textContent=jp?'本文を読み込めませんでした。':'Could not load the Markdown content.'})}var id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('post-status').className='status error';document.getElementById('post-status').textContent='Missing post id.'}else{fetch('posts/'+encodeURIComponent(id)+'/meta.json').then(function(r){if(!r.ok)throw Error('post unavailable');return r.json()}).then(function(data){post=data;loadMarkdown()}).catch(function(){document.getElementById('post-status').className='status error';document.getElementById('post-status').textContent='Post not found.'})}

<script>
function dateText(value) {
	var date = new Date(value + 'T00:00:00');
	if (jp) return date.getFullYear() + '.' + String(date.getMonth() + 1).padStart(2, '0') + '.' + String(date.getDate()).padStart(2, '0');
	return date.toLocaleDateString('en-GB', {year:'numeric', month:'short', day:'numeric'});
}
</script>
<script>
(function() {
	var meta = document.getElementById('post-meta');
	if (!meta) return;
	var updateMeta = function() {
		if (typeof post === 'undefined' || !post) return;
		var languages = (post.main_lang || []).map(function(language) {
			if (language === 'jp') return jp ? '日本語' : 'Japanese';
			if (language === 'en') return 'English';
			return language;
		}).join(', ');
		meta.textContent = jp
			? 'この記事は' + languages + 'で書かれています。他の言語はAIによる翻訳です。'
			: 'The post is written in ' + languages + '; other languages are AI-translated.';
	};
	var originalRender = render;
	render = function() {
		originalRender();
		updateMeta();
	};
})();
</script>
