*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Mono',monospace;background:var(--bg);min-height:100vh}.main{min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;position:relative}.grid-fade{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 0%,var(--bg) 72%);pointer-events:none;z-index:0}.frame{position:relative;max-width:900px;width:100%;margin:0 auto;padding:0 32px 80px;z-index:1}.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--ink)}.site-mark{font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--teal-deep)}.topbar-controls{display:flex;align-items:center;gap:8px}.topbar-btn{background:transparent;border:1px solid var(--ink);color:var(--ink);font-family:inherit;font-size:10.5px;letter-spacing:.1em;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s,color .15s;line-height:1}.topbar-btn:hover{background:var(--ink);color:var(--bg)}.icon-sun{display:none}.icon-moon{display:inline}body.dark .icon-sun{display:inline}body.dark .icon-moon{display:none}.nav-btn-wrap{position:relative}.nav-dropdown{display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--panel);border:1px solid var(--ink);padding:4px;z-index:90;min-width:150px}.nav-btn-wrap.open .nav-dropdown{display:block}.nav-dd-item{display:block;padding:7px 12px;font-size:10.5px;color:var(--ink);cursor:pointer;letter-spacing:.06em;text-decoration:none;white-space:nowrap}.nav-dd-item:hover{background:var(--teal-deep);color:var(--bg)}.nav-dd-item.current{color:var(--phosphor);pointer-events:none}.file-header{margin-top:40px;border:1px solid var(--ink);background:var(--panel);position:relative}.file-header:before{content:"";position:absolute;inset:8px;border:1px dashed var(--sage);pointer-events:none}.hero{padding:40px 32px 44px;position:relative;z-index:1}.eyebrow{font-size:10.5px;letter-spacing:.08em;color:var(--teal);margin-bottom:16px}.eyebrow-back{display:inline-flex;text-decoration:none;color:var(--ink);border:1px solid var(--ink);padding:3px 9px;margin-right:10px}.eyebrow-back:hover{background:var(--ink);color:var(--bg)}h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(38px,6vw,62px);color:var(--teal-deep);line-height:1.02}h1 .cursor{display:inline-block;width:.45ch;background:var(--phosphor);animation:blink 1s steps(1) infinite;margin-left:3px}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.role-line{margin-top:18px;font-family:'Space Grotesk',sans-serif;font-size:clamp(14px,1.8vw,18px);color:var(--ink);display:flex;flex-wrap:wrap;gap:8px 14px}.role-line .sep{color:var(--sage)}.role-line .count{color:var(--teal)}.hero-divider{margin-top:28px;height:1px;background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 10px);opacity:.4}.section-label{margin:52px 0 20px;display:flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal-deep)}.section-label:after{content:"";flex:1;height:1px;background:var(--ink);opacity:.4}.section-label .tri{color:var(--phosphor)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--ink);background:var(--card-screen);overflow:hidden;cursor:pointer;transition:transform .2s ease;display:flex;flex-direction:column}.card:hover{transform:translateY(-3px)}.card:hover .scan{opacity:1}.card-head{padding:7px 11px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid rgba(183,207,194,.2);color:var(--phosphor);display:flex;justify-content:space-between;gap:8px}.type{color:var(--amber)}.card-thumb{height:148px;position:relative;overflow:hidden;background:var(--card-screen);flex-shrink:0}.card-thumb img{width:100%;height:100%;object-fit:cover;opacity:.7;filter:saturate(.45) brightness(.75);display:block}.card:hover .card-thumb img{opacity:.88;filter:saturate(.65) brightness(.88)}.card-icon{height:100%;display:flex;align-items:center;justify-content:center}.card-icon i{font-size:38px;color:var(--phosphor);opacity:.4}.scan{position:absolute;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,rgba(63,203,142,.15),transparent);top:-40%;opacity:0;animation:scan 2.8s linear infinite;pointer-events:none}@keyframes scan{to{top:100%}}.phosphor-glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(63,203,142,.1));pointer-events:none}.card-body{padding:14px 13px 16px;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;flex:1}.card-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:4px}.card-date{font-size:9.5px;letter-spacing:.06em;color:var(--teal);margin-bottom:8px}.card-desc{font-size:10.5px;color:var(--sage);line-height:1.65;flex:1}.card-sub{font-size:9.5px;letter-spacing:.06em;color:var(--teal);text-transform:uppercase;margin-top:8px}footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;color:var(--sage)}.status{font-size:11px;color:var(--sage);padding:18px 0}.status.error{color:#9a4438}body.dark{--bg:#0C1F1B;--panel:#112920;--ink:#B7C9C0;--teal-deep:#3FCB8E;--teal:#6BAFA0;--sage:#8AAE9E;--line:#1C3530;--card-screen:#071310}body.dark .file-header{background:var(--panel);border-color:#2A4A40}body.dark .topbar,body.dark footer{border-color:#2A4A40}body.dark .card-body{background:var(--panel)}body.dark .card,body.dark .nav-dropdown{border-color:#2A4A40}body.dark .nav-dropdown{background:var(--panel)}body.dark .nav-dd-item{color:var(--ink)}@media(max-width:768px){.frame{padding:0 20px 60px}.hero{padding:26px 18px 30px}.cards{grid-template-columns:1fr}.topbar-btn{font-size:9.5px;padding:4px 8px}}@media(max-width:1024px) and (min-width:769px){.cards{grid-template-columns:repeat(2,1fr)}}.jp-loading .main{visibility:hidden}

(function(){var dark=localStorage.getItem('sw_dark')==='1';var jp=localStorage.getItem('sw_jp')==='1';function applyLang(){document.getElementById('topbar-lang-btn').textContent=jp?'English':'日本語';document.documentElement.lang=jp?'ja':'en';if(typeof window.onToggleLangContent==='function')window.onToggleLangContent(jp)}window.toggleDark=function(){dark=!dark;localStorage.setItem('sw_dark',dark?'1':'0');document.body.classList.toggle('dark',dark)};window.toggleLang=function(){jp=!jp;localStorage.setItem('sw_jp',jp?'1':'0');document.body.dataset.jp=jp?'1':'';applyLang()};window.toggleNavDropdown=function(){document.getElementById('nav-btn-wrap').classList.toggle('open')};document.addEventListener('click',function(e){if(!e.target.closest('#nav-btn-wrap'))document.getElementById('nav-btn-wrap').classList.remove('open')});setTimeout(function(){if(jp)applyLang();document.body.classList.remove('jp-loading')},0)})();
var posts=[];var jp=localStorage.getItem('sw_jp')==='1';function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function dateText(v){return new Date(v+'T00:00:00').toLocaleDateString(jp?'ja-JP':'en-GB',{year:'numeric',month:'short',day:'numeric'})}function postTitle(p){return p.title_en||p.title_jp||p.unique_id}function postDesc(p){return p.excerpt_en||p.excerpt_jp||''}function typeText(v){return {Review:jp?'レビュー':'Review','Grab Bag':jp?'雑談':'Grab Bag',Update:jp?'新着':'Update'}[v]||v}function render(){document.getElementById('page-h1').childNodes[0].textContent=jp?'更新':'updates';document.getElementById('page-sub').textContent=jp?'メモ、レビュー、日々の発見。':'notes, reviews, and small discoveries.';document.getElementById('page-count').textContent=jp?posts.length+'件':posts.length+' posts';document.getElementById('sec-label').textContent=jp?'すべての投稿':'ALL POSTS';document.getElementById('post-status').textContent='';document.getElementById('nav-home').textContent=jp?'ホーム':'home';document.getElementById('nav-works').textContent=jp?'制作実績':'works';document.getElementById('nav-blog').textContent=jp?'更新':'updates';document.getElementById('nav-art').textContent=jp?'イラスト':'art';document.getElementById('nav-about').textContent=jp?'自己紹介':'about';document.getElementById('nav-contact').textContent=jp?'お問い合わせ':'contact';document.getElementById('post-grid').innerHTML=posts.map(function(p,i){var title=postTitle(p);return '<a class="card" href="blog/post.html?id='+encodeURIComponent(p.unique_id)+'" style="text-decoration:none"><div class="card-head"><span>Post '+String(i+1).padStart(2,'0')+'</span><span class="type">'+esc(typeText(p.post_type))+'</span></div><div class="card-thumb">'+(p.thumbnail?'<img src="'+esc(p.thumbnail)+'" alt="'+esc(title)+'">':'<div class="card-icon"><i class="ti ti-notebook"></i></div>')+'<div class="scan"></div><div class="phosphor-glow"></div></div><div class="card-body"><div class="card-title">'+esc(title)+'</div><div class="card-date">'+esc(dateText(p.date))+'</div><div class="card-desc">'+esc(postDesc(p))+'</div><div class="card-sub">'+esc((p.main_lang||[]).join(' · '))+'</div></div></a>}).join('')}window.onToggleLangContent=function(value){jp=value;render()};fetch('blog/posts/index.json').then(function(r){if(!r.ok)throw Error('post index unavailable');return r.json()}).then(function(items){posts=items.sort(function(a,b){return new Date(b.date)-new Date(a.date)});render()}).catch(function(){document.getElementById('post-status').className='status error';document.getElementById('post-status').textContent=jp?'投稿を読み込めませんでした。':'Could not load posts. Serve this site over HTTP to enable JSON and Markdown loading.'});
</script>
<script>
var posts = [];
var jp = localStorage.getItem('sw_jp') === '1';
function esc(value) {
	return String(value || '').replace(/[&<>"']/g, function(character) {
		if (character === '&') return '&amp;';
		if (character === '<') return '&lt;';
		if (character === '>') return '&gt;';
		if (character === '"') return '&quot;';
		return '&#39;';
	});
}
function postTitle(post) { return jp ? (post.title_jp || post.title_en) : (post.title_en || post.title_jp || post.unique_id); }
function postExcerpt(post) { return jp ? (post.excerpt_jp || post.excerpt_en || '') : (post.excerpt_en || post.excerpt_jp || ''); }
function typeText(type) { return {Review: jp ? 'レビュー' : 'Review', 'Grab Bag': jp ? '雑談' : 'Grab Bag', Update: jp ? '新着' : 'Update'}[type] || type; }
function dateText(value) {
	var date = new Date(value + 'T00:00:00');
	if (jp) return date.getFullYear() + '.' + String(date.getMonth() + 1).padStart(2, '0') + '.' + String(date.getDate()).padStart(2, '0');
	return date.toLocaleDateString('en-GB', {year:'numeric', month:'short', day:'numeric'});
}
function renderPosts() {
	document.getElementById('page-h1').childNodes[0].textContent = jp ? 'ブログ' : 'blog';
	document.getElementById('page-sub').textContent = jp ? 'メモ、雑談、レビュー。' : 'notes, reviews, and small discoveries.';
	document.getElementById('page-count').textContent = jp ? posts.length + '件' : posts.length + ' posts';
	document.getElementById('sec-label').textContent = jp ? 'すべての投稿' : 'ALL POSTS';
	document.getElementById('nav-home').textContent = jp ? 'ホーム' : 'home';
	document.getElementById('nav-works').textContent = jp ? '制作実績' : 'works';
	document.getElementById('nav-blog').textContent = jp ? 'ブログ' : 'blog';
	document.getElementById('nav-art').textContent = jp ? 'イラスト' : 'art';
	document.getElementById('nav-about').textContent = jp ? '自己紹介' : 'about';
	document.getElementById('nav-contact').textContent = jp ? 'お問い合わせ' : 'contact';
	document.getElementById('topbar-lang-btn').textContent = jp ? 'English' : '日本語';
	document.documentElement.lang = jp ? 'ja' : 'en';
	document.getElementById('post-grid').innerHTML = posts.map(function(post, index) {
		var title = postTitle(post);
		var image = post.thumbnail ? '<img src="' + esc(post.thumbnail) + '" alt="' + esc(title) + '">' : '<div class="card-icon"><i class="ti ti-notebook"></i></div>';
		 return '<a class="card" href="blog/index.html?id=' + encodeURIComponent(post.unique_id) + '" style="text-decoration:none"><div class="card-head"><span>Post ' + String(index + 1).padStart(2, '0') + '</span><span class="type">' + esc(typeText(post.post_type)) + '</span></div><div class="card-thumb">' + image + '<div class="scan"></div><div class="phosphor-glow"></div></div><div class="card-body"><div class="card-title">' + esc(title) + '</div><div class="card-date">' + esc(dateText(post.date)) + '</div><div class="card-desc">' + esc(postExcerpt(post)) + '</div><div class="card-sub">' + esc((post.main_lang || []).join(' · ')) + '</div></div></a>';
	}).join('');
	document.getElementById('post-status').style.display = 'none';
	document.body.classList.remove('jp-loading');
}
window.toggleLang = function() { jp = !jp; localStorage.setItem('sw_jp', jp ? '1' : '0'); renderPosts(); };
window.toggleDark = function() { document.body.classList.toggle('dark'); localStorage.setItem('sw_dark', document.body.classList.contains('dark') ? '1' : '0'); };
window.toggleNavDropdown = function() { document.getElementById('nav-btn-wrap').classList.toggle('open'); };
fetch('blog/index.json').then(function(response) { if (!response.ok) throw Error('post index unavailable'); return response.json(); }).then(function(ids) { return Promise.all(ids.map(function(id) { return fetch('blog/posts/' + encodeURIComponent(id) + '/meta.json').then(function(response) { if (!response.ok) throw Error('post metadata unavailable'); return response.json(); }).then(function(post) { if (post.thumbnail) post.thumbnail = 'blog/posts/' + encodeURIComponent(post.unique_id) + '/' + post.thumbnail; return post; }); })); }).then(function(items) { posts = items.sort(function(a, b) { return new Date(b.date) - new Date(a.date); }); renderPosts(); }).catch(function() { document.getElementById('post-status').className = 'status error'; document.getElementById('post-status').textContent = 'Could not load posts. Serve this site over HTTP to enable JSON and Markdown loading.'; });
</script>
